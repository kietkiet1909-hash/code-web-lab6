<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đoán số may mắn </title>
</head>
<body>
    <h1> Đoán số may mắn </h1>
    <label for="">Nhập số từ 1 đến 10 : </label>
    <input type="number" id="number" >
    <button onclick="doanSo()">Đoán số</button>
    <p id="result"></p>
    <script>
        function doanSo(){
            let number = document.getElementById("number").value;
            let randomNumber = Math.floor(Math.random() * 10) + 1;
            if(number == randomNumber){
                document.getElementById("result").innerHTML = "Chúc mừng bạn đã đoán đúng số may mắn: " + randomNumber;
            }else{
                document.getElementById("result").innerHTML = "Rất tiếc! Số may mắn là: " + randomNumber;
            }
        }
    </script>
</body>
</html>
