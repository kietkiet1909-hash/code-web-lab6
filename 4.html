<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation - Direction Buttons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .header {
            background-color: #f1f1f1;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 30px auto;
            text-align: center;
        }

        #Container {
            width: 400px;
            height: 400px;
            margin: 20px auto;
            position: relative;
            background: #222222;
            border-radius: 8px;
            overflow: hidden;
        }

        #Animation {
            width: 50px;
            height: 50px;
            position: absolute;
            background-color: #ff0000;
            left: 0px;
            top: 0px;
            border-radius: 4px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            width: 90px;
            height: 40px;
            font-size: 18px;
            color: #fff;
            background: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Animation Example</h1>
    </div>

    <div class="container">
        <div class="buttons">
            <button onclick="move('up')">Lên</button>
            <button onclick="move('down')">Xuống</button>
            <button onclick="move('left')">Trái</button>
            <button onclick="move('right')">Phải</button>
            <button onclick="move('diagonal')">Chéo</button>
        </div>

        <div id="Container">
            <div id="Animation"></div>
        </div>
    </div>

    <script>
        var posX = 0;
        var posY = 0;
        var speed = 20;

        function move(direction) {
            var elem = document.getElementById("Animation");
            var container = document.getElementById("Container");

            var maxLeft = container.clientWidth - elem.offsetWidth;
            var maxTop = container.clientHeight - elem.offsetHeight;

            switch (direction) {
                case 'up':
                    posY = Math.max(posY - speed, 0);
                    break;
                case 'down':
                    posY = Math.min(posY + speed, maxTop);
                    break;
                case 'left':
                    posX = Math.max(posX - speed, 0);
                    break;
                case 'right':
                    posX = Math.min(posX + speed, maxLeft);
                    break;
                case 'diagonal':
                    posX = Math.min(posX + speed, maxLeft);
                    posY = Math.min(posY + speed, maxTop);
                    break;
            }

            elem.style.left = posX + 'px';
            elem.style.top = posY + 'px';
        }
    </script>
</body>
</html>
