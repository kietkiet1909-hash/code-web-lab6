<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình bặt /tắt bóng đèn </h2>
    <img id="bulb" src="./bulboff.gif" width="120px" alt="light">
    <br><br>
    <button onclick="toggleLight()"> On/off</button>
    <!--code javascript ở đây-->
    <script type="text/javascript">
      function toggleLight(){
        let toggle = document.getElementById("bulb");
        if(toggle.src.includes("bulboff.gif")){
            toggle.src = "./bulbon.gif";
        }else{
            toggle.src = "./bulboff.gif";
        }
      }
    </script>
</body>
</html>
