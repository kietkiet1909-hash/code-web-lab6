<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án ghề nghiệp </title>
</head>
<body>
    <h1> Dự án ghề nghiệp </h1>
    <input type="text" id="name" placeholder="Nhập tên của bạn">
    <button onclick="generateJob()">Tìm nghề nghiệp</button>
    <p id="result"></p>
    <script>
    const jobs =[
    "Kỹ sư phần mềm",
    "Nhà thiết kế đồ họa",
    "Chuyên viên marketing",
    "Nhà phân tích dữ liệu",
    "Chuyên viên nhân sự",
    "Nhà quản lý dự án",
    "Chuyên viên tài chính",
    "Nhà phát triển web",
    "Chuyên viên chăm sóc khách hàng",
    "Nhà nghiên cứu thị trường"];
    function generateJob(){
        let name = document.getElementById("name").value;
        let randomIndex = Math.floor(Math.random() * jobs.length);
        let job = jobs[randomIndex];
        document.getElementById("result").innerHTML = name + ", nghề nghiệp phù hợp với bạn là: " + job;
    }
    </script>
</body>
</html>
