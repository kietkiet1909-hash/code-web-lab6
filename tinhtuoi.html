<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Chương trình tính tuổi</h2>
    <label for="">Nhập năm sinh: </label>
    <input type="number" id="namsinh" >
    <button onclick="tinhTuoi()">Tính tuổi</button>
    <p id="result"></p>
    <script >
        function tinhTuoi(){
            let yourBirth = document.getElementById("namsinh").value;
            let currentYear = new Date().getFullYear();
            let yourAge = currentYear - yourBirth;
            document.getElementById("result").innerHTML = "Tuổi của bạn là: " + yourAge;
        }
    </script>
</body>
</html>
