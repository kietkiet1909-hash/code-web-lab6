<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi nhiệt độ </title>
</head>
<body>
    <h1>Chuyển đổi nhiệt độ</h1>
    <input type="number" id="temperature" placeholder="Nhập nhiệt độ">
    <select id="fromUnit">
        <option value="celsius">Celsius</option>
        <option value="fahrenheit">Fahrenheit</option>
    </select>
    <select id="toUnit">
        <option value="celsius">Celsius</option>
        <option value="fahrenheit">Fahrenheit</option>
    </select>
    <button onclick="convertTemperature()">Chuyển đổi</button>
    <p id="result"></p>
    <script>
        function convertTemperature(){
            let temperature = parseFloat(document.getElementById("temperature").value);
            let fromUnit = document.getElementById("fromUnit").value;
            let toUnit = document.getElementById("toUnit").value;
            let result;

            if(fromUnit === "celsius" && toUnit === "fahrenheit"){
                result = (temperature * 9/5) + 32;
            } else if(fromUnit === "fahrenheit" && toUnit === "celsius"){
                result = (temperature - 32) * 5/9;
            } else {
                result = temperature;
            }

            document.getElementById("result").innerHTML = result.toFixed(2) + " " + toUnit;
        }
    </script>
</body>
</html>
