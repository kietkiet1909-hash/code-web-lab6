<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 15 - removeDuplicates</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function removeDuplicates(arr) {
        const result = [];

        for (let i = 0; i < arr.length; i++) {
          if (!result.includes(arr[i])) {
            result.push(arr[i]);
          }
        }

        return result;
      }

      print(removeDuplicates([1, 2, 2, 3, 4, 4, 5])); // [1, 2, 3, 4, 5]
    </script>
  </body>
</html>
