<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 7 - isAscending</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function isAscending(arr) {
        if (arr.length < 2) {
          return false;
        }

        for (let i = 1; i < arr.length; i++) {
          if (arr[i] <= arr[i - 1]) {
            return false;
          }
        }

        return true;
      }

      print(isAscending([1, 2, 3, 5])); // true
    </script>
  </body>
</html>
