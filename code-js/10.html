<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 10 - sumOfSquares</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function sumOfSquares(arr) {
        let sum = 0;

        for (let i = 0; i < arr.length; i++) {
          sum += arr[i] * arr[i];
        }

        return sum;
      }

      print(sumOfSquares([1, 2, 3])); // 14
      print(sumOfSquares([4, 5, 6])); // 77
    </script>
  </body>
</html>
