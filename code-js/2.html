<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 2 - sumOddNumbers</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function sumOddNumbers(arr) {
        let sum = 0;

        for (let i = 0; i < arr.length; i++) {
          if (arr[i] % 2 !== 0) {
            sum += arr[i];
          }
        }

        return sum;
      }

      print(sumOddNumbers([1, 2, 3, 4, 5])); // 9
    </script>
  </body>
</html>
