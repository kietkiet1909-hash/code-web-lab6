<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 4 - countPositiveNumbers</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function countPositiveNumbers(arr) {
        let count = 0;

        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > 0) {
            count++;
          }
        }

        return count;
      }

      print(countPositiveNumbers([-1, 2, 3, -4, 5])); // 3
    </script>
  </body>
</html>
