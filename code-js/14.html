<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 14 - findMissingNumber</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function findMissingNumber(arr, n) {
        let expectedSum = 0;

        for (let i = 1; i <= n; i++) {
          expectedSum += i;
        }

        let actualSum = 0;

        for (let i = 0; i < arr.length; i++) {
          actualSum += arr[i];
        }

        return expectedSum - actualSum;
      }

      print(findMissingNumber([1, 2, 4, 5, 6], 6)); // 3
      print(findMissingNumber([3, 7, 1, 2, 8, 4, 5], 8)); // 6
      print(findMissingNumber([1, 2, 3, 4], 4)); // 0
    </script>
  </body>
</html>
