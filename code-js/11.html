<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 11 - filterEvensAndSum</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function filterEvensAndSum(arr) {
        let sum = 0;

        for (let i = 0; i < arr.length; i++) {
          if (arr[i] % 2 === 0) {
            sum += arr[i];
          }
        }

        return sum;
      }

      print(filterEvensAndSum([1, 2, 3, 4, 5, 6])); // 12
      print(filterEvensAndSum([12, 14, 15, 19, 20, 100])); // 146
    </script>
  </body>
</html>
