<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 5 - sumArray</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function sumArray(arr) {
        let sum = 0;

        for (let i = 0; i < arr.length; i++) {
          sum += arr[i];
        }

        return sum;
      }

      print(sumArray([1, 2, 3, 4, 5])); // 15
    </script>
  </body>
</html>
