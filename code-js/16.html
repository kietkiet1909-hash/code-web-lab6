<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 16 - findPairsWithSum</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + JSON.stringify(value) + "</p>"); }

      function findPairsWithSum(arr, sum) {
        const pairs = [];

        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            if (arr[i] + arr[j] === sum) {
              pairs.push([arr[i], arr[j]]);
            }
          }
        }

        return pairs;
      }

      print(findPairsWithSum([1, 2, 3, 4, 5], 5)); // [[1, 4], [2, 3]]
    </script>
  </body>
</html>
