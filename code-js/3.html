<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 3 - findMin</title>
  </head>
  <body>
    <script>
      function print(value) { document.body.insertAdjacentHTML("beforeend", "<p>" + value + "</p>"); }

      function findMin(arr) {
        if (arr.length === 0) {
          return undefined;
        }

        let min = arr[0];

        for (let i = 1; i < arr.length; i++) {
          if (arr[i] < min) {
            min = arr[i];
          }
        }

        return min;
      }

      print(findMin([5, 2, 8, 1, 4])); // 1
    </script>
  </body>
</html>
