<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra mật khẩu </title>
</head>
<body>
    <h1>Kiểm tra mật khẩu</h1>
    <input type="password" id="password" placeholder="Nhập mật khẩu">
    <button onclick="checkPassword()">Kiểm tra</button>
    <p id="result"></p>
    <script>
        function checkPassword(){
            let password = document.getElementById("password").value;
            if(password.length < 8){
                document.getElementById("result").innerHTML = "Mật khẩu yếu";
            }else{
                document.getElementById("result").innerHTML = "Mật khẩu mạnh";
            }
        }
    </script>
</body>
</html>
