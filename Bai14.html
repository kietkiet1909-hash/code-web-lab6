<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
</head>
<body>
    <h1>Tính chỉ số BMI</h1>
    <label for="weight">Cân nặng (kg):</label>
    <input type="number" id="weight" placeholder="Nhập cân nặng">
    <br><br>
    <label for="height">Chiều cao (m):</label>
    <input type="number" id="height" placeholder="Nhập chiều cao">
    <br><br>
    <button onclick="calculateBMI()">Tính BMI</button>
    <p id="result"></p>
    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            if (isNaN(weight) || isNaN(height) || height <= 0) {
                document.getElementById("result").innerHTML = "Vui lòng nhập giá trị hợp lệ cho cân nặng và chiều cao.";
                return;
            }
            let bmi = weight / (height * height);
            let category = "";
            if (bmi < 18.5) {
                category = "Thiếu cân";
            } else if (bmi < 24.9) {
                category = "Bình thường";
            } else if (bmi < 29.9) {
                category = "Thừa cân";
            } else {
                category = "Béo phì";
            }
            document.getElementById("result").innerHTML = "Chỉ số BMI của bạn là: " + bmi.toFixed(2) + " (" + category + ")";
        }
    </script>
</body>
</html>
