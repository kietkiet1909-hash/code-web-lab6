<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 3 - Máy tính</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 420px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #222;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background: #eef7ff;
            border: 1px solid #cfe3ff;
            border-radius: 8px;
            color: #0b5ed7;
            font-weight: bold;
            min-height: 24px;
        }

        .demo {
            margin-top: 20px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            line-height: 1.8;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Máy tính cơ bản</h2>

        <div class="input-group">
            <label for="numA">Nhập số A:</label>
            <input type="number" id="numA" value="20">
        </div>

        <div class="input-group">
            <label for="numB">Nhập số B:</label>
            <input type="number" id="numB" value="30">
        </div>

        <div class="buttons">
            <button onclick="tinhToan('+')">Cộng</button>
            <button onclick="tinhToan('-')">Trừ</button>
            <button onclick="tinhToan('*')">Nhân</button>
            <button onclick="tinhToan('/')">Chia</button>
        </div>

        <div class="result" id="result">Kết quả: </div>

        <div class="demo" id="demo"></div>
    </div>

    <script>
        function tinhToan(operator) {
            var a = Number(document.getElementById("numA").value);
            var b = Number(document.getElementById("numB").value);
            var ketQua;

            switch (operator) {
                case '+':
                    ketQua = a + b;
                    break;
                case '-':
                    ketQua = a - b;
                    break;
                case '*':
                    ketQua = a * b;
                    break;
                case '/':
                    if (b === 0) {
                        document.getElementById("result").innerText = "Kết quả: Không thể chia cho 0";
                        return;
                    }
                    ketQua = a / b;
                    break;
                default:
                    ketQua = 0;
            }

            document.getElementById("result").innerText = "Kết quả: " + a + " " + operator + " " + b + " = " + ketQua;
        }

        window.onload = function () {
            var a = 20;
            var b = 30;
            document.getElementById("demo").innerHTML =
                "3.1 Demo phép tính cơ bản:<br>" +
                "Cộng: " + (a + b) + "<br>" +
                "Trừ: " + (a - b) + "<br>" +
                "Nhân: " + (a * b) + "<br>" +
                "Chia: " + (a / b);
        };
    </script>
</body>
</html>
